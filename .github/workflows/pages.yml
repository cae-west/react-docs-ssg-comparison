# Builds the Docusaurus and MkDocs Material versions of the React docs and
# publishes them to GitHub Pages:
#   /                 landing page + write-up (pages-landing/: index.html, react-logo.svg, screenshots/)
#   /docusaurus/      Docusaurus build
#   /mkdocs/          MkDocs Material build
# The GitBook version is hosted by GitBook and linked from the landing page.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'gitbook/**'
      - 'gitbook-docs.yaml'
      - '**/README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SITE_ROOT: /react-docs-ssg-comparison

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docusaurus/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Docusaurus
        working-directory: docusaurus
        env:
          DOCS_BASE_URL: /react-docs-ssg-comparison/docusaurus/
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build MkDocs Material
        working-directory: mkdocs
        env:
          SITE_URL: https://cae-west.github.io/react-docs-ssg-comparison/mkdocs/
        run: |
          pip install mkdocs==1.6.1 mkdocs-material==9.7.7
          mkdocs build

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r pages-landing/. _site/
          cp -r docusaurus/build _site/docusaurus
          cp -r mkdocs/site _site/mkdocs
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
